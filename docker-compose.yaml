services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: juriq-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-service:
    build:
      context: .
      dockerfile: ./orchestrator-service/Dockerfile
    container_name: juriq-orchestrator-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TRANSLATOR_SERVICE_URL: http://translator-service:8012
      SOLVER_SERVICE_URL: http://solver-service:8010
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-local}
    ports:
      - "8011:8011"
    depends_on:
      translator-service:
        condition: service_started
      solver-service:
        condition: service_started

  translator-service:
    build:
      context: .
      dockerfile: ./translator-service/Dockerfile
    container_name: juriq-translator-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-local}
    ports:
      - "8012:8012"
    depends_on:
      postgres:
        condition: service_healthy

  solver-service:
    build:
      context: .
      dockerfile: ./solver-service/Dockerfile
    container_name: juriq-solver-service
    restart: unless-stopped
    ports:
      - "8010:8010"

  streamlit-ui:
    build:
      context: .
      dockerfile: ./streamlit-ui/Dockerfile
    container_name: juriq-streamlit-ui
    restart: unless-stopped
    environment:
      ORCHESTRATOR_URL: http://orchestrator-service:8011
      TRANSLATOR_URL: http://translator-service:8012
      SOLVER_URL: http://solver-service:8010
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
    ports:
      - "8501:8501"
    depends_on:
      orchestrator-service:
        condition: service_started
      translator-service:
        condition: service_started
      solver-service:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: juriq-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - juriq-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  juriq-data:
