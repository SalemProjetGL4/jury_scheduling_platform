services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: juriq-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./logs/backend:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-service:
    build:
      context: .
      dockerfile: ./orchestrator-service/Dockerfile
    container_name: juriq-orchestrator-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TRANSLATOR_SERVICE_URL: http://translator-service:8012
      SOLVER_SERVICE_URL: http://solver-service:8010
      REFLECTOR_SERVICE_URL: http://reflector-service:8013
      UPDATER_SERVICE_URL: http://updater-service:8014
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-local}
      SOLVER_TIMEOUT_SECONDS: ${SOLVER_TIMEOUT_SECONDS:-600}
    ports:
      - "8011:8011"
    volumes:
      - ./logs/orchestrator:/app/logs
    depends_on:
      translator-service:
        condition: service_started
      solver-service:
        condition: service_started
      reflector-service:
        condition: service_started


  translator-service:
    build:
      context: .
      dockerfile: ./translator-service/Dockerfile
    container_name: juriq-translator-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-local}
    ports:
      - "8012:8012"
    volumes:
      - ./logs/translator:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  reflector-service:
    build:
      context: .
      dockerfile: ./reflector-service/Dockerfile
    container_name: juriq-reflector-service
    restart: unless-stopped
    env_file:
      - ./reflector-service/.env
    ports:
      - "8013:8013"
    volumes:
      - ./logs/reflector:/app/logs

  solver-service:
    build:
      context: .
      dockerfile: ./solver-service/Dockerfile
    container_name: juriq-solver-service
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-604800}
    ports:
      - "8010:8010"
    volumes:
      - ./logs/solver:/app/logs
    depends_on:
      redis:
        condition: service_started

  updater-service:
    build:
      context: .
      dockerfile: ./updater-service/Dockerfile
    container_name: juriq-updater-service
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8014:8014"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: juriq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      orchestrator-service:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: juriq-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - juriq-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: juriq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  juriq-data:
